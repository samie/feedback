name: Publish to Vaadin Directory

# Pushing a tag vX.Y.Z releases version X.Y.Z:
# - builds the add-on ZIP with the version taken from the tag (pom.xml is not
#   changed in the repository),
# - uploads it to Vaadin Directory with the annotated tag message as release notes,
# - creates a GitHub Release with the same notes and a link to Directory.
# A tag with a suffix (v1.2.0-rc1) is uploaded as an unpublished Directory draft
# and marked as a GitHub pre-release.
# Requires the repository secret DIRECTORY_API_KEY.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

env:
  COMPONENT: feedback
  DIRECTORY_URL: https://vaadin.com/directory/component/feedback

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Prepare version and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # Only the git tag has the "v" prefix; Directory and Maven get the bare version
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag $TAG does not give a valid version: $version" >&2
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PRERELEASE=$prerelease" >> "$GITHUB_ENV"

          # checkout may leave the annotated tag peeled to a commit, so fetch it again
          git fetch --force origin "+refs/tags/$TAG:refs/tags/$TAG"
          notes=""
          if [[ "$(git cat-file -t "$TAG")" == "tag" ]]; then
            notes="$(git for-each-ref --format='%(contents:subject)%0a%0a%(contents:body)' "refs/tags/$TAG")"
          fi
          if [[ -z "${notes//[[:space:]]/}" ]]; then
            if previous="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null)"; then
              notes="$(git log --format='- %s' "$previous..$TAG")"
            else
              notes="$(git log --format='- %s' "$TAG")"
            fi
          fi
          printf '%s\n' "$notes" > notes.md
          cat notes.md

      - name: Build
        run: |
          mvn -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn -B clean install -Pdirectory

      - name: Upload to Vaadin Directory
        env:
          DIRECTORY_API_KEY: ${{ secrets.DIRECTORY_API_KEY }}
        run: |
          [[ -n "$DIRECTORY_API_KEY" ]] || { echo "DIRECTORY_API_KEY secret is not set" >&2; exit 1; }
          publish=true
          [[ "$PRERELEASE" == true ]] && publish=false
          zip="target/$COMPONENT-$VERSION.zip"
          echo "Uploading $zip (version $VERSION, publish=$publish)"
          status="$(curl -sS -o response.txt -w '%{http_code}' -X POST \
              "https://vaadin.com/vaadincom/directory-service/upload/$COMPONENT?authKey=$DIRECTORY_API_KEY" \
              -H "accept: */*" \
              -F "file=@$zip;type=application/zip" \
              -F "publish=$publish" \
              -F "releaseNotes=<notes.md")"
          echo "HTTP $status"
          cat response.txt; echo
          [[ "$status" =~ ^2 ]]

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            cat notes.md
            echo
            echo "---"
            echo "Download and usage instructions: $DIRECTORY_URL"
          } > release.md
          flags=()
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          gh release create "$TAG" --title "$VERSION" --notes-file release.md --verify-tag "${flags[@]}"

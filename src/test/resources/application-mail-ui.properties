# Used by the demo with -Pmail-ui: feedback emails go to an embedded GreenMail
# SMTP server, and GreenMailUiConfig serves a web inbox for them.
feedback.embedded-smtp=true
spring.mail.host=localhost
spring.mail.port=3025
# The inbox is a separate Vaadin app on its own server: keep its routes and
# frontend resources out of the demo
vaadin.blocked-packages=org.vaadin.greenmail
